<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="seq01-title seq01-desc">
  <title id="seq01-title">01 메모리 CRUD 책임 지도</title>
  <desc id="seq01-desc">시스템 밖 Client 요청이 입구·출구 Controller와 서비스·정책 Service를 지나 상태·데이터 Memory에 도달하고, 응답과 재시작 초기화 조건을 확인하는 지도</desc>
  <metadata>Source: A&amp;I Backend Visual Lab; License: project-local educational asset; redistribution follows repository terms.</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2955E4"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#176F72"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .frame{fill:#FFFFFF;stroke:#6F82B8;stroke-width:2}
      .node{stroke-width:2.5}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .flow{fill:none;stroke:#2955E4;stroke-width:3;marker-end:url(#arrow)}
      .return{fill:none;stroke:#176F72;stroke-width:3;marker-end:url(#return-arrow)}
      .state{fill:#F6F7FA;stroke:#64748B;stroke-width:2;stroke-dasharray:7 5}
      .group{font-size:27px;font-weight:850;fill:#0C2691}
      .layer{font-size:25px;font-weight:800;fill:#4B587C;text-anchor:middle}
      .name{font-size:28px;font-weight:800;text-anchor:middle}
      .body{font-size:25px;font-weight:650;fill:#4B587C;text-anchor:middle}
      .state-copy{font-size:25px;font-weight:800;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="340" fill="#F8F9FB"/>
  <rect x="20" y="20" width="680" height="300" rx="18" class="frame"/>
  <text x="34" y="59" class="group">요청 책임이 이동하는 위치</text>

  <g data-layer="outside">
    <rect x="25" y="82" width="140" height="90" rx="10" class="node layer-outside"/>
    <text x="95" y="108" class="layer">시스템 밖</text>
    <text x="95" y="146" class="name">Client</text>
  </g>
  <path d="M165 127h15" class="flow"/>
  <g data-layer="interface">
    <rect x="185" y="82" width="160" height="90" rx="10" class="node layer-interface"/>
    <text x="265" y="108" class="layer">입구·출구</text>
    <text x="265" y="146" class="name">Controller</text>
  </g>
  <path d="M345 127h15" class="flow"/>
  <g data-layer="application">
    <rect x="365" y="82" width="145" height="90" rx="10" class="node layer-application"/>
    <text x="437.5" y="108" class="layer">서비스·정책</text>
    <text x="437.5" y="146" class="name">Service</text>
  </g>
  <path d="M510 127h15" class="flow"/>
  <g data-layer="resource">
    <rect x="530" y="76" width="160" height="102" rx="10" class="node layer-resource"/>
    <text x="610" y="102" class="layer">상태·데이터</text>
    <text x="610" y="134" class="name">Memory</text>
    <text x="610" y="162" class="body">List + id</text>
  </g>

  <path d="M610 190v40H95v-46" class="return"/>
  <text x="353" y="212" class="body">Response DTO 반환</text>
  <g data-semantic="state">
    <rect x="150" y="252" width="420" height="52" rx="9" class="state"/>
    <text x="360" y="285" class="state-copy">process 재시작 → Memory 초기화</text>
  </g>
</svg>
